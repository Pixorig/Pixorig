<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixorig — Creative Image & Typography Studio</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div id="app">
    <!-- Top bar -->
    <header id="topbar">
      <span class="topbar-brand">Pixorig</span>
      <nav class="topbar-actions">
        <button class="top-btn" data-action="undo" title="Undo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 14L4 9l5-5" />
            <path d="M4 9h10.5a6.5 6.5 0 0 1 6.5 6.5v0a6.5 6.5 0 0 1-6.5 6.5H11" />
          </svg>
          <span>Undo</span>
        </button>
        <button class="top-btn" data-action="redo" title="Redo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 14l5-5-5-5" />
            <path d="M20 9H9.5A6.5 6.5 0 0 0 3 15.5v0A6.5 6.5 0 0 0 9.5 22H13" />
          </svg>
          <span>Redo</span>
        </button>
        <div class="topbar-divider"></div>
        <button class="top-btn" data-action="ruler" title="Ruler">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2.5" />
            <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
          </svg>
          <span>Ruler</span>
        </button>
        <button class="top-btn" data-action="layer" title="Layer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12,2 2,7 12,12 22,7" />
            <path d="M2 12l10 5 10-5" />
            <path d="M2 17l10 5 10-5" />
          </svg>
          <span>Layer</span>
        </button>
        <button class="top-btn" data-action="add" title="Add">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.5" />
            <line x1="12" y1="8" x2="12" y2="16" />
            <line x1="8" y1="12" x2="16" y2="12" />
          </svg>
          <span>Add</span>
        </button>
        <button class="top-btn" data-action="save" title="Save">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
            <polyline points="17 21 17 13 7 13 7 21" />
            <polyline points="7 3 7 8 15 8" />
          </svg>
          <span>Save</span>
        </button>
        <div class="topbar-divider"></div>
        <button class="top-btn" data-action="more" title="More">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <circle cx="12" cy="5" r="1.8" />
            <circle cx="12" cy="12" r="1.8" />
            <circle cx="12" cy="19" r="1.8" />
          </svg>
          <span>Other</span>
        </button>
      </nav>
    </header>

    <!-- Body: sidebar + canvas -->
    <div id="body" class="sub-open">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-group">
          <div class="sidebar-section" data-section="elements">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7" cy="7" r="4" />
              <rect x="13" y="3" width="8" height="8" rx="1.5" />
              <polygon points="12,14 17,21 7,21" />
            </svg>
            <span>Elements</span>
          </div>
          <div class="sidebar-section" data-section="text">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7V4h16v3" />
              <path d="M12 4v16" />
              <path d="M8 20h8" />
            </svg>
            <span>Text</span>
          </div>
          <div class="sidebar-section" data-section="image">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2.5" />
              <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
            <span>Image</span>
          </div>
          <div class="sidebar-section active" data-section="background">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <!-- Backdrop layer behind canvas -->
              <rect x="2" y="2" width="15" height="15" rx="3" stroke-dasharray="2.5 2" opacity="0.6" />
              <!-- Foreground canvas surface -->
              <rect x="7" y="7" width="15" height="15" rx="3" fill="currentColor" fill-opacity="0.15" />
              <!-- Base horizon anchor -->
              <path d="M7 17h15" opacity="0.4" />
              <path d="M12 7v15" opacity="0.4" stroke-dasharray="2 2" />
            </svg>
            <span>Background</span>
          </div>
          <div class="sidebar-section" data-section="effects">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l2.4 5 5.6.8-4 4 1 5.7-5-2.7-5 2.7 1-5.7-4-4 5.6-.8L12 2z" />
              <path d="M19 19l2 3M21 19l-2 3M3 5l2-2M5 5L3 3" stroke-width="1.5" />
            </svg>
            <span>Effects</span>
          </div>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section" data-section="setting">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span>Setting</span>
        </div>
      </aside>

      <!-- Sub sidebar (shown when a section requires it) -->
      <aside id="sub-sidebar">
        <!-- Elements items -->
        <div class="sub-group hidden" data-section="elements">
          <button class="sub-item" data-sub="el-emojis">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M9 10h.01M15 10h.01" stroke-width="2.5" />
              <path d="M8 14.5c1 1.5 2.5 2.5 4 2.5s3-1 4-2.5" />
            </svg>
            <span>Emojis</span>
          </button>
          <button class="sub-item" data-sub="el-shapes">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="4.5" />
              <rect x="11.5" y="10.5" width="8.5" height="8.5" rx="1.5" />
            </svg>
            <span>Shapes</span>
          </button>
          <button class="sub-item" data-sub="el-bezier">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="15.5" width="5" height="5" rx="1" fill="currentColor" fill-opacity="0.2" />
              <rect x="16.5" y="3.5" width="5" height="5" rx="1" fill="currentColor" fill-opacity="0.2" />
              <path d="M5 15.5C5 7 17 17 19 8.5" />
              <line x1="5" y1="15.5" x2="9" y2="10" stroke-width="1.2" stroke-dasharray="2 2" />
              <line x1="19" y1="8.5" x2="15" y2="14" stroke-width="1.2" stroke-dasharray="2 2" />
              <circle cx="9" cy="10" r="1.5" fill="currentColor" stroke="none" />
              <circle cx="15" cy="14" r="1.5" fill="currentColor" stroke="none" />
            </svg>
            <span>Bezier</span>
          </button>
          <button class="sub-item" data-sub="el-arrow">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="12" x2="19" y2="12" stroke-width="2" />
              <polyline points="13 6 19 12 13 18" stroke-width="2" />
              <circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none" />
            </svg>
            <span>Arrow</span>
          </button>
        </div>
        <!-- Text items -->
        <div class="sub-group hidden" data-section="text">
          <button class="sub-item" data-sub="text-new">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7V4h10v3" />
              <path d="M9 4v13" />
              <path d="M15 17h6" />
              <path d="M18 14v6" />
            </svg>
            <span>New Text</span>
          </button>
        </div>
        <!-- Image items -->
        <div class="sub-group hidden" data-section="image">
          <button class="sub-item" data-sub="img-from-upload">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16.5v2A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5v-2" />
              <polyline points="7 9 12 4 17 9" />
              <line x1="12" y1="4" x2="12" y2="16" />
            </svg>
            <span>From Upload</span>
          </button>
          <button class="sub-item" data-sub="img-from-camera">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
            <span>From Camera</span>
          </button>
          <button class="sub-item" data-sub="img-filters">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="9" r="6" />
              <circle cx="15" cy="15" r="6" />
              <path d="M12 9a6 6 0 0 1 3 3" />
            </svg>
            <span>Filters</span>
          </button>
          <button class="sub-item" data-sub="img-adjust">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="21" x2="4" y2="14" />
              <line x1="4" y1="10" x2="4" y2="3" />
              <line x1="12" y1="21" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12" y2="3" />
              <line x1="20" y1="21" x2="20" y2="16" />
              <line x1="20" y1="12" x2="20" y2="3" />
              <line x1="1" y1="14" x2="7" y2="14" />
              <line x1="9" y1="8" x2="15" y2="8" />
              <line x1="17" y1="16" x2="23" y2="16" />
            </svg>
            <span>Adjust</span>
          </button>
          <button class="sub-item" data-sub="img-size">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2.5" />
              <path d="M9 3v18M3 9h18" stroke-dasharray="2 2" opacity="0.6" />
              <path d="M8 12h8M12 8v8" stroke-width="2" />
            </svg>
            <span>Size</span>
          </button>
          <button class="sub-item" data-sub="img-liquify">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
            </svg>
            <span>Liquify</span>
          </button>
          <button class="sub-item" data-sub="img-retouch">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" />
              <path d="M15 4v4M13 6h4" stroke-width="2" />
            </svg>
            <span>Retouch</span>
          </button>
          <button class="sub-item" data-sub="img-cutout">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="6" r="3" />
              <circle cx="6" cy="18" r="3" />
              <line x1="20" y1="4" x2="8.12" y2="15.88" />
              <line x1="14.47" y1="14.48" x2="20" y2="20" />
              <line x1="8.12" y1="8.12" x2="12" y2="12" />
            </svg>
            <span>Cutout</span>
          </button>
        </div>
        <!-- Text Properties (shown when New Text is clicked) -->
        <div class="sub-group text-props-group hidden" data-section="text-props">
          <button class="sub-item" data-sub="text-props-back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5" />
              <path d="M11 18l-6-6 6-6" />
            </svg>
            <span>Back</span>
          </button>
          <button class="sub-item" data-prop="relative-position">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" stroke-dasharray="2.5 2.5" opacity="0.6" />
              <circle cx="12" cy="12" r="2.5" fill="currentColor" />
              <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
            </svg>
            <span>Relative Position</span>
          </button>
          <button class="sub-item" data-prop="size">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M3 5h9v2.5H9V19H6.5V7.5H3V5zm9 5h8v2h-2.8V19H15V12h-3v-2z" />
            </svg>
            <span>Size</span>
          </button>
          <button class="sub-item" data-prop="padding">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2.5" stroke-dasharray="2 2" opacity="0.5" />
              <rect x="7.5" y="7.5" width="9" height="9" rx="1.5" fill="currentColor" fill-opacity="0.2" stroke-width="1.8" />
              <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke-width="1.8" />
            </svg>
            <span>Padding</span>
          </button>
          <button class="sub-item" data-prop="color">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.5a9.5 9.5 0 0 0-9.5 9.5c0 4.5 3.5 8 8 8 .8 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.4-.5-.9-.5-1.4 0-1.1.9-2 2-2h1.9c3.9 0 6.5-2.6 6.5-6.5 0-5.2-4.3-9-9.5-9z" />
              <circle cx="7.5" cy="11.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="10" cy="7.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="14" cy="7.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="16.5" cy="11.5" r="1.3" fill="currentColor" stroke="none" />
            </svg>
            <span>Color</span>
          </button>
          <button class="sub-item" data-prop="texture">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <path d="M3 9l6-6M3 15l12-12M3 21l18-18M9 21l12-12M15 21l6-6" />
            </svg>
            <span>Texture</span>
          </button>
          <button class="sub-item" data-prop="opacity">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="9" cy="12" r="6" />
              <circle cx="15" cy="12" r="6" fill="currentColor" fill-opacity="0.3" />
              <path d="M12 6.6a6 6 0 0 1 3 5.4 6 6 0 0 1-3 5.4 6 6 0 0 1-3-5.4 6 6 0 0 1 3-5.4z" fill="currentColor" fill-opacity="0.5" stroke="none" />
            </svg>
            <span>Opacity</span>
          </button>
          <button class="sub-item" data-prop="rotate">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.7 1 6.3 2.7L21 8" />
              <path d="M21 3v5h-5" />
            </svg>
            <span>Rotate</span>
          </button>
          <button class="sub-item" data-prop="font">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2.5 18.5L7.8 4.5h2l5.3 14h-2.3l-1.3-3.8H6.1l-1.3 3.8H2.5zm4.3-5.7h4l-2-5.7-2 5.7z" />
              <path d="M17.8 12.2c.7-.6 1.6-.9 2.6-.9 1.8 0 2.6.9 2.6 2.4v4.8h-1.8v-1.1c-.6.8-1.4 1.3-2.4 1.3-1.4 0-2.4-.8-2.4-2.1 0-1.4 1.1-2.2 2.8-2.2.7 0 1.3.1 1.8.3v-.3c0-.6-.4-1-1.2-1-.7 0-1.3.3-1.6.7l-.4-1.9zm3 2.6c-.4-.2-.9-.3-1.4-.3-.7 0-1.2.3-1.2 1 0 .6.4.9 1 .9.7 0 1.2-.4 1.6-.9v-.7z" />
            </svg>
            <span>Font</span>
          </button>
          <button class="sub-item" data-prop="style">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M4 4h6.5a3.5 3.5 0 0 1 2.3 6.1A3.7 3.7 0 0 1 13.5 16H4V4zm2.6 4.8h3.6a1.3 1.3 0 1 0 0-2.6H6.6v2.6zm0 4.8h4a1.4 1.4 0 1 0 0-2.8h-4v2.8z" />
              <path d="M15 4h4.5M13.5 16h4.5M16.8 4l-2.6 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <path d="M4 19.5h15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <span>Style</span>
          </button>
          <button class="sub-item" data-prop="curve">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 18C5.5 8 18.5 8 21 18" stroke-width="2" />
              <circle cx="3" cy="18" r="2" fill="currentColor" />
              <circle cx="12" cy="10.5" r="2" fill="currentColor" />
              <circle cx="21" cy="18" r="2" fill="currentColor" />
              <path d="M9.5 7l2.5-4 2.5 4M10.3 5.8h3.4" stroke-width="1.5" />
            </svg>
            <span>Curve</span>
          </button>
          <button class="sub-item" data-prop="background">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="3" fill="currentColor" fill-opacity="0.18" />
              <path d="M8 8.5h8M12 8.5v7" stroke-width="2" />
            </svg>
            <span>Background</span>
          </button>
          <button class="sub-item" data-prop="align">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 5h18M3 10h12M3 15h18M3 20h12" />
            </svg>
            <span>Align</span>
          </button>
          <button class="sub-item" data-prop="spacing">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="4" x2="6" y2="13" stroke-width="2" />
              <line x1="12" y1="4" x2="12" y2="13" stroke-width="2" />
              <line x1="18" y1="4" x2="18" y2="13" stroke-width="2" />
              <path d="M2 18.5h20M2 18.5l3-2.5M2 18.5l3 2.5M22 18.5l-3-2.5M22 18.5l-3 2.5" />
            </svg>
            <span>Spacing</span>
          </button>
          <button class="sub-item" data-prop="line-spacing">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="11" y1="6" x2="20" y2="6" stroke-width="2" />
              <line x1="11" y1="12" x2="20" y2="12" stroke-width="2" />
              <line x1="11" y1="18" x2="20" y2="18" stroke-width="2" />
              <path d="M5 4v16M5 4l-2.5 2.5M5 4l2.5 2.5M5 20l-2.5-2.5M5 20l2.5-2.5" />
            </svg>
            <span>Line Spacing</span>
          </button>
          <button class="sub-item" data-prop="stroke">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
              <path d="M5 4h14v4h-4v12h-6V8H5V4z" />
            </svg>
            <span>Stroke</span>
          </button>
          <button class="sub-item" data-prop="shadow">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M4 4h10v3h-3.3v10H7.3V7H4V4z" />
              <path d="M9.5 9.5H19v3h-3.3V20h-3.4v-7.5H9.5v-3z" opacity="0.32" />
            </svg>
            <span>Shadow</span>
          </button>
          <button class="sub-item" data-prop="inner-shadow">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <rect x="3" y="3" width="18" height="18" rx="4" />
              <path d="M5 9a4 4 0 0 1 4-4h8" stroke-width="2.8" opacity="0.85" />
              <path d="M6 11.5a3 3 0 0 1 3-3h6" stroke-width="1.8" opacity="0.4" />
            </svg>
            <span>Inner Shadow</span>
          </button>
          <button class="sub-item" data-prop="emboss">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
              <polygon points="12,2 22,12 12,22 2,12" />
              <polygon points="12,2 22,12 12,12" fill="currentColor" fill-opacity="0.5" stroke="none" />
              <polygon points="12,22 2,12 12,12" fill="currentColor" fill-opacity="0.15" stroke="none" />
              <line x1="2" y1="12" x2="22" y2="12" stroke-width="1.4" />
              <line x1="12" y1="2" x2="12" y2="22" stroke-width="1.4" />
            </svg>
            <span>Emboss</span>
          </button>
          <button class="sub-item" data-prop="perspective">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 4h14l3.5 16H1.5L5 4z" />
              <path d="M3.2 15h17.6M4.2 9.5h15.6M12 4v16" stroke-width="1.4" />
            </svg>
            <span>Perspective</span>
          </button>
          <button class="sub-item" data-prop="3d-rotate">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.5l7.5 4.3v6.4l-7.5 4.3-7.5-4.3V6.8L12 2.5z" />
              <path d="M12 2.5v10.7M19.5 6.8l-7.5 6.4M4.5 6.8l7.5 6.4" stroke-width="1.4" />
              <path d="M4 17.5c2 2.5 5 3.8 8 3.8 4 0 7-1.8 8-4.3" stroke-dasharray="2.5 2" />
              <path d="M21 14v3.5h-3.5" />
            </svg>
            <span>3d Rotate</span>
          </button>
          <button class="sub-item" data-prop="3d-text">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M3.5 8h8.5v2.8H9v8.7H6V10.8H3.5V8z" />
              <path d="M12 8l4.5-4h-8.5L3.5 8H12z" opacity="0.8" />
              <path d="M12 8v2.8l4.5-4V2.8L12 8z" opacity="0.6" />
              <path d="M9 10.8v8.7l4.5-4v-8.7L9 10.8z" opacity="0.45" />
              <path d="M6 19.5l4.5-4H7.5l-1.5 4z" opacity="0.7" />
            </svg>
            <span>3d Text</span>
          </button>
          <button class="sub-item" data-prop="3d-shadow">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M6 3h10v2.6h-3.4v7.4H9.4V5.6H6V3z" />
              <path d="M9.4 13l4.6 7.5h4L13.4 13H9.4z" opacity="0.28" />
              <path d="M6 16.5l8.5 4h4l-8.5-4H6z" opacity="0.38" />
              <line x1="2" y1="13" x2="22" y2="13" stroke="currentColor" stroke-width="1.4" opacity="0.5" />
            </svg>
            <span>3d Shadow</span>
          </button>
          <button class="sub-item" data-prop="reflection">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M5 3h14v2.5h-5v5.5h-4V5.5H5V3z" />
              <line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2" opacity="0.5" />
              <path d="M5 21h14v-2.5h-5V13h-4v5.5H5V21z" opacity="0.3" />
            </svg>
            <span>Reflection</span>
          </button>
        </div>
        <!-- Background items -->
        <div class="sub-group" data-section="background">
          <button class="sub-item" data-sub="bg-color">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.5a9.5 9.5 0 0 0-9.5 9.5c0 4.5 3.5 8 8 8 .8 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.4-.5-.9-.5-1.4 0-1.1.9-2 2-2h1.9c3.9 0 6.5-2.6 6.5-6.5 0-5.2-4.3-9-9.5-9z" />
              <circle cx="7.5" cy="11.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="10" cy="7.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="14" cy="7.5" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="16.5" cy="11.5" r="1.3" fill="currentColor" stroke="none" />
            </svg>
            <span>Color</span>
          </button>
          <button class="sub-item" data-sub="bg-transparent">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" />
              <rect x="3" y="3" width="4.5" height="4.5" />
              <rect x="12" y="3" width="4.5" height="4.5" />
              <rect x="7.5" y="7.5" width="4.5" height="4.5" />
              <rect x="16.5" y="7.5" width="4.5" height="4.5" />
              <rect x="3" y="12" width="4.5" height="4.5" />
              <rect x="12" y="12" width="4.5" height="4.5" />
              <rect x="7.5" y="16.5" width="4.5" height="4.5" />
              <rect x="16.5" y="16.5" width="4.5" height="4.5" />
            </svg>
            <span>Transparent</span>
          </button>
          <button class="sub-item" data-sub="bg-size">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2.5" />
              <path d="M9 3v18M3 9h18" stroke-dasharray="2 2" opacity="0.6" />
              <path d="M8 12h8M12 8v8" stroke-width="2" />
            </svg>
            <span>Size</span>
          </button>
          <button class="sub-item" data-sub="bg-crop">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2v14a2 2 0 0 0 2 2h14" />
              <path d="M18 22V8a2 2 0 0 0-2-2H2" />
            </svg>
            <span>Crop</span>
          </button>
          <button class="sub-item" data-sub="bg-from-upload">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16.5v2A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5v-2" />
              <polyline points="7 9 12 4 17 9" />
              <line x1="12" y1="4" x2="12" y2="16" />
            </svg>
            <span>From Upload</span>
          </button>
          <button class="sub-item" data-sub="bg-from-camera">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
            <span>From Camera</span>
          </button>
        </div>
        <!-- Effects items -->
        <div class="sub-group hidden" data-section="effects">
          <button class="sub-item" data-sub="fx-rotate">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.7 1 6.3 2.7L21 8" />
              <path d="M21 3v5h-5" />
            </svg>
            <span>Rotate</span>
          </button>
          <button class="sub-item" data-sub="fx-vignette">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="12" cy="12" r="6" stroke-dasharray="2.5 2.5" />
              <circle cx="12" cy="12" r="2.5" fill="currentColor" />
            </svg>
            <span>Vignette</span>
          </button>
          <button class="sub-item" data-sub="fx-noise">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="7" cy="7" r="1" fill="currentColor" stroke="none" />
              <circle cx="13" cy="6" r="1.2" fill="currentColor" stroke="none" />
              <circle cx="17" cy="9" r="0.8" fill="currentColor" stroke="none" />
              <circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none" />
              <circle cx="15" cy="13" r="1" fill="currentColor" stroke="none" />
              <circle cx="6" cy="16" r="0.9" fill="currentColor" stroke="none" />
              <circle cx="12" cy="17" r="1.4" fill="currentColor" stroke="none" />
              <circle cx="18" cy="16.5" r="1" fill="currentColor" stroke="none" />
            </svg>
            <span>Noise</span>
          </button>
          <button class="sub-item" data-sub="fx-stripes">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <line x1="3" y1="7" x2="21" y2="7" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="17" x2="21" y2="17" />
            </svg>
            <span>Stripes</span>
          </button>
          <button class="sub-item" data-sub="fx-brightness">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
            <span>Brightness</span>
          </button>
          <button class="sub-item" data-sub="fx-contrast">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
            </svg>
            <span>Contrast</span>
          </button>
          <button class="sub-item" data-sub="fx-hue">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 12L18.36 5.64M12 12l6.36 6.36M12 12H3" stroke-width="1.5" />
              <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none" />
            </svg>
            <span>Hue</span>
          </button>
          <button class="sub-item" data-sub="fx-saturation">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.5s7 8.5 7 13.5a7 7 0 1 1-14 0c0-5 7-13.5 7-13.5z" />
              <path d="M12 6.5s4 4.5 4 8a4 4 0 0 1-8 0c0-3.5 4-8 4-8z" fill="currentColor" fill-opacity="0.25" stroke="none" />
            </svg>
            <span>Saturation</span>
          </button>
        </div>
      </aside>

      <!-- Canvas area -->
      <main id="canvas-area">
        <div id="dropzone">
          <svg viewBox="0 0 24 24" width="48" height="48">
            <path fill="currentColor"
              d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" />
          </svg>
          <p>Drag & drop an image here</p>
        </div>
        <canvas id="canvas"></canvas>
      </main>

      <!-- Layer sidebar (right) -->
      <aside id="layer-sidebar">
        <div class="layer-sidebar-header">
          <span class="layer-sidebar-title">Layers</span>
          <div class="layer-header-actions">
            <button class="layer-delete-btn" id="layer-delete-selected" title="Delete selected layers" style="display:none;">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
              </svg>
            </button>
            <button class="layer-sidebar-close" title="Close layers panel">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="layer-list" id="layer-list">
          <!-- Layers will be dynamically inserted here -->
        </div>
      </aside>
    </div>
  </div>

  <!-- Main app bundled by Vite -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
