name: Build and Deploy to Pixorig Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-pixorig-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish build to Pixorig/pixorig.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.PIXORIG_PAGES_DEPLOY_TOKEN }}
          TARGET_REPOSITORY: Pixorig/pixorig.github.io
          TARGET_BRANCH: main
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Missing Actions secret PIXORIG_PAGES_DEPLOY_TOKEN."
            exit 1
          fi

          git clone "https://x-access-token:${DEPLOY_TOKEN}@github.com/${TARGET_REPOSITORY}.git" pages
          cd pages

          if git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}"; then
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout --orphan "$TARGET_BRANCH"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../dist/. .
          touch .nojekyll

          git config user.name "pixorig-deploy[bot]"
          git config user.email "pixorig-deploy[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No deployment changes to publish."
            exit 0
          fi

          git commit -m "Deploy Pixorig build from ${SOURCE_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"
